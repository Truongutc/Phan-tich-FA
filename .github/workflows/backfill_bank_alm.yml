name: Backfill Lịch sử Rủi ro ALM Ngân hàng

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Ky can backfill, dinh dang YYYY-Qn (vd 2025-Q1, Q1-Q4 deu duoc, xac nhan 2026-08 la BCTC quy thuong CUNG co bang gap) hoac YYYY-FY (bao cao nam da kiem toan). Nhap kieu nao cung duoc: 2025-Q1, Q1-2025, 1-2025 deu hieu la Quy 1/2025; 2025-FY hoac FY-2025 deu la bao cao nam. Nhap ky Quy 4 se tu dong uu tien thu ban NAM (dang tin hon) truoc, chi dung ban Quy 4 neu ngan hang do chua co ban nam. DE TRONG: tu dong quet lai TAT CA cac ky da tung backfill truoc day (moi ky, CHI OCR lai dung nhung ma dang thieu, bo qua ma da co du lieu that) - dung khi muon "don" het nhung gi con thieu tren toan bo lich su trong 1 lan chay, khong phai tu tay chay lai tung ky.'
        required: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Nhap 1 ky cu the: 26 ngan hang x toi da vai phut OCR/ngan hang cho 1 KY DUY NHAT - 90 phut du
    # du so voi uoc tinh ~65 phut xau nhat (giong nguong dung cho analyze_stock.yml). DE TRONG ky
    # (quet lai TAT CA ky da tung backfill, xem backfill_all_missing_periods()): moi ky da co da
    # dang "reported" duoc bo qua NGAY (khong OCR, chi 1 lan doc JSON) nen tong thoi gian phu thuoc
    # SO LUONG TO HOP (ngan hang, ky) DANG THIEU thuc te, khong phai tong so ky x 26 - van giu nguong
    # rong (240 phut) de an toan cho truong hop thieu nhieu dot dau.
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          # tesseract-ocr-vie/tesseract-ocr-osd: xem giải thích chi tiết trong analyze_stock.yml —
          # cùng lý do (bank_risk_notes.py cần cả 2 gói này để OCR tiếng Việt + tự sửa trang bị lật).
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-vie tesseract-ocr-osd
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Nhap ky -> backfill dung 1 ky do cho ca 26 ma. De trong ky -> quet lai TAT CA ky da tung
      # backfill truoc day (backfill_all_missing_periods() - moi ky TU DONG bo qua ma da co du lieu
      # that, chi OCR lai dung ma dang thieu).
      - name: Backfill ALM ngan hang (1 ky hoac tat ca ky con thieu)
        run: |
          python -c "
          from bank_system_risk import backfill_period, backfill_all_missing_periods
          period = '${{ github.event.inputs.period }}'.strip()
          if period:
              backfill_period(period)
          else:
              print('[INFO] Khong nhap ky - tu dong quet lai TAT CA ky da tung backfill, chi lay phan con thieu.')
              backfill_all_missing_periods()
          "

      # SỬA (2026-08-31, user muốn có bản Excel lưu lại "tiện import khi xóa trắng cập nhật lại" —
      # trước đây sheet ALM_NganHang_Raw chỉ được ghi khi chạy TOÀN BỘ pipeline vĩ mô hàng tuần
      # (template_vimo.py), không có ở workflow backfill riêng lẻ này — nghĩa là sau khi backfill 1
      # kỳ lịch sử, phải đợi tới lần chạy vĩ mô kế tiếp mới thấy trong Excel). update_bank_alm_excel_
      # sheet() tự đọc lại TOÀN BỘ data/bank_alm/*.json (nguồn dữ liệu gốc, không phụ thuộc file
      # Excel cũ) nên chạy độc lập được ngay tại đây, không cần đợi pipeline vĩ mô.
      - name: Cập nhật sheet Excel dữ liệu thô ALM + upload Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
        run: |
          python -c "from bank_system_risk import update_bank_alm_excel_sheet; update_bank_alm_excel_sheet('Bao cao/VIMO')"
          python3 - << 'PYEOF'
          import glob
          import google_drive_uploader

          xlsxs = sorted(glob.glob("Bao cao/VIMO/*.xlsx"))
          if not xlsxs:
              print("[WARN] Khong tim thay file Excel de upload.")
          else:
              _, url = google_drive_uploader.upload_file(xlsxs[-1], sector="Vĩ mô", ticker="VIMO")
              print(f"[OK] Da upload Excel: {url}" if url else "[WARN] Upload Excel that bai.")
          PYEOF

      - name: Commit và push data/bank_alm/ + Excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/bank_alm/ "Bao cao/VIMO/"

          if git diff --staged --quiet; then
            echo "Khong co thay doi de commit."
          else
            PERIOD_LABEL="${{ github.event.inputs.period }}"
            if [ -z "$PERIOD_LABEL" ]; then
              PERIOD_LABEL="quet lai tat ca ky con thieu"
            fi
            git commit -m "Backfill ALM ngan hang — ${PERIOD_LABEL} — $(date +'%Y-%m-%d')"

            # Chi commit/push data/bank_alm/ (moi file rieng biet theo ticker, khong phai kieu "ghi
            # de toan bo 1 file" nhu vimo.json) — rebase len remote an toan, giong pattern da dung o
            # analyze_stock.yml, khac han pattern "reset --hard + restore" cua update_vimo.yml.
            #
            # SUA (2026-09-21, phat hien qua log thuc bi loi sau 5 lan thu): xung dot rebase HAU HET
            # chi xay ra o file Excel VIMO_Lich_Su_Chi_So.xlsx (file duoc TU DONG SINH RA lai tu
            # data/bank_alm/*.json moi lan chay - KHONG PHAI file sua tay - git khong the tu merge
            # noi dung binary nen luon bao conflict neu origin cung vua ghi de file nay). Truoc day
            # gap loi la git rebase --abort roi lap lai NGUYEN VEN cung 1 lenh rebase - xung dot
            # KHONG BAO GIO tu het vi luon la file nay, dan den luon thua sau 5 lan thu du du lieu
            # JSON (phan THAT can luu) khong co gi mau thuan. Gio: neu xung dot CHI o dung file Excel
            # nay, lay ban tren origin lam diem xuat phat, tiep tuc rebase, roi REGENERATE lai Excel
            # tu du lieu JSON DA MERGE DAY DU (goi lai chinh ham dung de tao file nay) truoc khi
            # amend vao commit va push tiep - dam bao khong mat ca thay doi cua minh lan thay doi cua
            # lan chay khac tren origin.
            PUSHED=0
            for i in 1 2 3 4 5; do
              git fetch origin master
              if git rebase origin/master; then
                if git push origin HEAD:master; then
                  PUSHED=1
                  break
                fi
              else
                CONFLICTS="$(git diff --name-only --diff-filter=U)"
                if [ "$CONFLICTS" = "Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx" ]; then
                  echo "Xung dot CHI o file Excel tu sinh - lay ban tren origin, regenerate lai roi tiep tuc rebase."
                  git show origin/master:"Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx" > "Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx"
                  git add "Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx"
                  if git rebase --continue; then
                    python -c "from bank_system_risk import update_bank_alm_excel_sheet; update_bank_alm_excel_sheet('Bao cao/VIMO')"
                    git add "Bao cao/VIMO/"
                    if ! git diff --staged --quiet; then
                      git commit --amend --no-edit
                    fi
                  else
                    git rebase --abort
                  fi
                else
                  git rebase --abort
                fi
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 10
            done

            if [ "$PUSHED" != "1" ]; then
              echo "::error::Khong the push ket qua backfill sau 5 lan thu (remote lien tuc thay doi)."
              exit 1
            fi
          fi
