name: Cập nhật ALM Ngân hàng - 1 mã

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ma co phieu ngan hang can cap nhat (vd BID, STB, ACB). DE TRONG: tu dong quet ca 26 ma o ky ben duoi, CHI OCR lai nhung ma dang "missing" (bo qua het cac ma da co du lieu that/da nhap tay) - luc do input "force" ben duoi khong ap dung.'
        required: false
      period:
        description: 'Quy va nam can cap nhat, dinh dang YYYY-Qn hoac YYYY-FY. Nhap kieu nao cung duoc: 2025-Q1, Q1-2025, 1-2025 deu hieu la Quy 1/2025; 2025-FY hoac FY-2025 deu la bao cao nam. Nhap ky Quy 4 se tu dong uu tien thu ban NAM (dang tin hon) truoc, chi dung ban Quy 4 neu ngan hang do chua co ban nam.'
        required: true
      force:
        description: 'CHI ap dung khi co nhap ma o tren. Luon OCR lai du ma do da co du lieu "reported" san (dung khi biet du lieu cu bi thieu/sai, vd sau khi sua 1 fix OCR). Bo chon de chi chay khi ma nay THAT SU dang thieu kỳ nay.'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  backfill-single:
    runs-on: ubuntu-latest
    # Truong hop nhap 1 ma: nhanh (vai phut). Truong hop DE TRONG ma (quet tim + OCR lai TAT CA ma
    # dang "missing"): co the gan bang ca backfill_bank_alm.yml (26 ma) neu dang thieu nhieu - giu
    # cung nguong 90 phut de an toan, khong bi cat ngang giua chung.
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          # tesseract-ocr-vie/tesseract-ocr-osd: xem giai thich chi tiet trong analyze_stock.yml -
          # cung ly do (bank_risk_notes.py can ca 2 goi nay de OCR tieng Viet + tu sua trang bi lat).
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-vie tesseract-ocr-osd
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chot chan 2026-09: test cac loai loi doc sai da gap that (xem test_bank_alm_validate.py) - neu
      # ai do sua bo kiem tra roi lam no mat kha nang bat loi, workflow dung ngay o day.
      - name: Test bo kiem tra ALM
        run: python test_bank_alm_validate.py

      # Nhap ma -> chi OCR lai dung 1 ma do (backfill_single_ticker). De trong ma -> quet ca 26 ma,
      # TU DONG bo qua ma nao da co du lieu that ("reported", ke ca du lieu nhap tay - da luu cung
      # status nay), CHI OCR lai dung nhung ma dang "missing" o ky nay (backfill_period() - ham DUNG
      # CHUNG voi backfill_bank_alm.yml, doc thang tu data/bank_alm/*.json - nguon du lieu goc sinh
      # ra sheet Excel, KHONG can doc lai file Google Sheet qua mang vi ket qua giong het nhau).
      - name: Cap nhat ALM (1 ma hoac tat ca ma dang thieu)
        run: |
          python -c "
          from bank_system_risk import backfill_period, backfill_single_ticker
          ticker = '${{ github.event.inputs.ticker }}'.strip()
          period = '${{ github.event.inputs.period }}'
          if ticker:
              backfill_single_ticker(ticker, period, force='${{ github.event.inputs.force }}'.lower() == 'true')
          else:
              print('[INFO] Khong nhap ma - tu dong quet + OCR lai TAT CA ma dang missing o ky nay.')
              backfill_period(period)
          "

      # Quet TOAN BO du lieu ALM bang bank_alm_validate (so cheo tong tai san/tong no 2 bang, no phai
      # tra khong co qua han, no khong trung dong gap, tong tai san vs Vietcap...). Ky nghi doc sai duoc
      # ghi vao data/bank_alm/_needs_review.json + tom tat trong tab Summary cua run; KHONG lam fail
      # workflow (de van luu duoc so lieu moi de xem), nhung ky da doi chieu thu cong (`verified`) se
      # KHONG bi OCR ghi de neu ket qua moi khong qua kiem tra (xem bank_alm_store.upsert_reported_period).
      - name: Kiem tra hop ly du lieu ALM
        run: python bank_alm_validate.py

      # Sheet ALM_NganHang_Raw tu doc lai TOAN BO data/bank_alm/*.json (nguon du lieu goc) moi lan
      # chay nen ghi de an toan, luon phan anh dung trang thai moi nhat - giong het buoc tuong ung
      # trong backfill_bank_alm.yml.
      - name: Cap nhat sheet Excel du lieu tho ALM + upload Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
        run: |
          python -c "from bank_system_risk import update_bank_alm_excel_sheet; update_bank_alm_excel_sheet('Bao cao/VIMO')"
          python3 - << 'PYEOF'
          import glob
          import google_drive_uploader

          xlsxs = sorted(glob.glob("Bao cao/VIMO/*.xlsx"))
          if not xlsxs:
              print("[WARN] Khong tim thay file Excel de upload.")
          else:
              _, url = google_drive_uploader.upload_file(xlsxs[-1], sector="Vĩ mô", ticker="VIMO")
              print(f"[OK] Da upload Excel: {url}" if url else "[WARN] Upload Excel that bai.")
          PYEOF

      - name: Commit va push data/bank_alm/ + Excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/bank_alm/ "Bao cao/VIMO/"

          if git diff --staged --quiet; then
            echo "Khong co thay doi de commit."
          else
            TICKER_LABEL="${{ github.event.inputs.ticker }}"
            if [ -z "$TICKER_LABEL" ]; then
              TICKER_LABEL="cac ma dang missing"
            fi
            git commit -m "Cap nhat ALM ${TICKER_LABEL} — ${{ github.event.inputs.period }} — $(date +'%Y-%m-%d')"

            # SUA (2026-09-21, phat hien qua log thuc bi loi sau 5 lan thu): xung dot rebase HAU HET
            # chi xay ra o file Excel VIMO_Lich_Su_Chi_So.xlsx (file duoc TU DONG SINH RA lai tu
            # data/bank_alm/*.json moi lan chay - KHONG PHAI file sua tay - git khong the tu merge
            # noi dung binary nen luon bao conflict neu origin cung vua ghi de file nay). Truoc day
            # gap loi la git rebase --abort roi lap lai NGUYEN VEN cung 1 lenh rebase - xung dot
            # KHONG BAO GIO tu het vi luon la file nay, dan den luon thua sau 5 lan thu du du lieu
            # JSON (phan THAT can luu) khong co gi mau thuan. Gio: neu xung dot CHI o dung file Excel
            # nay, lay ban tren origin lam diem xuat phat, tiep tuc rebase, roi REGENERATE lai Excel
            # tu du lieu JSON DA MERGE DAY DU (goi lai chinh ham dung de tao file nay) truoc khi
            # amend vao commit va push tiep - dam bao khong mat ca thay doi cua minh lan thay doi cua
            # lan chay khac tren origin.
            PUSHED=0
            for i in 1 2 3 4 5; do
              git fetch origin master
              if git rebase origin/master; then
                if git push origin HEAD:master; then
                  PUSHED=1
                  break
                fi
              else
                CONFLICTS="$(git diff --name-only --diff-filter=U)"
                if [ "$CONFLICTS" = "Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx" ]; then
                  echo "Xung dot CHI o file Excel tu sinh - lay ban tren origin, regenerate lai roi tiep tuc rebase."
                  git show origin/master:"Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx" > "Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx"
                  git add "Bao cao/VIMO/VIMO_Lich_Su_Chi_So.xlsx"
                  if git rebase --continue; then
                    python -c "from bank_system_risk import update_bank_alm_excel_sheet; update_bank_alm_excel_sheet('Bao cao/VIMO')"
                    git add "Bao cao/VIMO/"
                    if ! git diff --staged --quiet; then
                      git commit --amend --no-edit
                    fi
                  else
                    git rebase --abort
                  fi
                else
                  git rebase --abort
                fi
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 10
            done

            if [ "$PUSHED" != "1" ]; then
              echo "::error::Khong the push ket qua cap nhat sau 5 lan thu (remote lien tuc thay doi)."
              exit 1
            fi
          fi
