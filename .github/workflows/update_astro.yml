name: Cập nhật Chiêm tinh Tài chính

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'   # 08:00 giờ Việt Nam (UTC+7) sáng Thứ 2 đầu tuần hàng tuần (user 2026-08-04: chuyển từ hàng ngày sang hàng tuần)

permissions:
  contents: write
  actions: write

jobs:
  update-astro:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ephem requests

      - name: Tính toán dữ liệu chiêm tinh (vị trí hành tinh, góc chiếu, nhật/nguyệt thực)
        run: python template_astro.py

      - name: Commit và push kết quả
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # KHÔNG dùng "git rebase origin/master" ở đây — data/astro.json là file GHI ĐÈ TOÀN BỘ
          # mỗi lần chạy (không phải sửa từng dòng), nên nếu remote ĐÃ có 1 bản ghi đè khác (VD do
          # user vừa push tay 1 bản mới, hoặc lần chạy trước), rebase sẽ conflict CHẮC CHẮN (không
          # phải race condition thoáng qua) — thử lại 3 lần vẫn conflict y hệt, dẫn tới job fail dù
          # dữ liệu tính ra hoàn toàn đúng (đã xảy ra thật 2026-08-06). Dùng "git reset --soft" mỗi
          # vòng lặp: đưa nhánh về đúng đầu remote MỚI NHẤT rồi commit LẠI đúng file trên đĩa (không
          # đổi) — không bao giờ conflict, tự phục hồi nếu remote đổi tiếp giữa các lần thử.
          PUSHED=0
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --soft origin/master
            git add data/astro.json 2>/dev/null || true

            if git diff --staged --quiet; then
              echo "Không có thay đổi để commit."
              PUSHED=1
              break
            fi

            git commit -m "Auto-update: Chiêm tinh Tài chính — $(date +'%Y-%m-%d')"
            if git push origin HEAD:master; then
              PUSHED=1
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 10
          done

          if [ "$PUSHED" != "1" ]; then
            echo "::error::Could not push chiêm tinh update after 5 attempts."
            exit 1
          fi

      # QUAN TRỌNG: push tạo bởi GITHUB_TOKEN mặc định KHÔNG kích hoạt workflow "on: push" khác —
      # gọi thẳng deploy_pages.yml để site GitHub Pages có data/astro.json mới ngay.
      - name: Trigger GitHub Pages redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_pages.yml --ref ${{ github.ref_name }}
