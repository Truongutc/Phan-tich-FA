name: Cập nhật Vĩ mô Việt Nam

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 5'   # 09:00 UTC = 16:00 giờ Việt Nam (UTC+7), thứ Sáu hàng tuần (user 2026-08-15: đổi từ 15:30 sang 16:00)

permissions:
  contents: write
  actions: write

jobs:
  update-vimo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tesseract OCR (+ gói ngôn ngữ Việt) — đọc số liệu cơ cấu vốn đầu tư từ ẢNH infographic
      # NSO (nso.gov.vn/do-hoa-thong-tin), không có ở dạng text — xem
      # fetch_nso_infographic_investment() trong fetch_macro_data.py.
      - name: Install Tesseract OCR (tiếng Việt)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie

      - name: Fetch dữ liệu vĩ mô mới nhất (World Bank/IMF/FRED/FX/NSO)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_macro_data.py

      - name: Tính toán Scorecard + Tổng hợp phân tích + xuất PDF/JSON
        run: python -c "from template_vimo import run_vimo_analysis; run_vimo_analysis()"

      - name: Upload PDF lên Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
        run: |
          python3 - << 'PYEOF'
          import glob
          import json
          import os

          import google_drive_uploader

          pdfs = sorted(glob.glob("Bao cao/VIMO/*.pdf"))
          if not pdfs:
              print("[WARN] Không tìm thấy PDF vĩ mô, bỏ qua upload.")
          else:
              pdf_path = pdfs[-1]
              _, pdf_url = google_drive_uploader.upload_file(pdf_path, sector="Vĩ mô", ticker="VIMO")
              json_path = "data/vimo.json"
              if pdf_url and os.path.exists(json_path):
                  with open(json_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  data["gdrivePdfUrl"] = pdf_url
                  with open(json_path, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  print(f"[OK] Đã gắn gdrivePdfUrl vào data/vimo.json: {pdf_url}")
          PYEOF

      - name: Commit và push kết quả
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # KHÔNG dùng "git rebase origin/master" ở đây — data/vimo*.json là file GHI ĐÈ TOÀN BỘ
          # mỗi lần chạy (không phải sửa từng dòng), nên nếu remote ĐÃ có 1 bản ghi đè khác, rebase
          # sẽ conflict CHẮC CHẮN (không phải race condition thoáng qua) — thử lại nhiều lần vẫn
          # conflict y hệt, dẫn tới job fail dù dữ liệu tính ra hoàn toàn đúng (đã xác nhận xảy ra
          # thật với update_astro.yml cùng pattern, 2026-08-06).
          #
          # SỬA LỖI NGHIÊM TRỌNG (2026-08-13): bản trước dùng "git reset --soft origin/master" rồi
          # add đúng các file data — nhưng --soft KHÔNG đồng bộ index/working tree với các file
          # KHÁC ngoài file được add tường minh. Nếu remote đã có commit MỚI (vd user vừa push sửa
          # template_vimo.py/fetch_macro_data.py/app_vimo.js) xen giữa lúc workflow checkout và lúc
          # commit ở đây, thì bản CŨ của những file đó (từ checkout ban đầu) vẫn còn trong
          # index/working tree sau reset --soft, và bị commit ĐÈ LÊN — XÓA MẤT thay đổi mới trên
          # remote một cách âm thầm (đã xác nhận xảy ra thật với update_astro.yml cùng pattern,
          # 2026-08-13: fetch_astro_data.py/app_chiemtinh.js bị revert về bản cũ). Dùng "git reset
          # --hard origin/master" thay vào đó — đồng bộ TOÀN BỘ nhánh/index/working tree về ĐÚNG
          # remote mới nhất trước, rồi mới ghi đè LẠI đúng các file data đã tính ở bước trước (lưu
          # tạm ra ngoài cây git để không bị mất khi reset --hard) — đảm bảo commit ở đây CHỈ BAO
          # GIỜ đụng tới các file data đó.
          mkdir -p /tmp/vimo_output/BaoCaoVIMO
          cp data/vimo_raw.json /tmp/vimo_output/ 2>/dev/null || true
          cp data/vimo.json /tmp/vimo_output/ 2>/dev/null || true
          cp data/vnindex_valuation_history.json /tmp/vimo_output/ 2>/dev/null || true
          cp -r "Bao cao/VIMO/." /tmp/vimo_output/BaoCaoVIMO/ 2>/dev/null || true

          restore_output() {
            cp /tmp/vimo_output/vimo_raw.json data/vimo_raw.json 2>/dev/null || true
            cp /tmp/vimo_output/vimo.json data/vimo.json 2>/dev/null || true
            cp /tmp/vimo_output/vnindex_valuation_history.json data/vnindex_valuation_history.json 2>/dev/null || true
            mkdir -p "Bao cao/VIMO"
            cp -r /tmp/vimo_output/BaoCaoVIMO/. "Bao cao/VIMO/" 2>/dev/null || true
          }

          PUSHED=0
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            restore_output
            git add data/vimo_raw.json data/vimo.json data/vnindex_valuation_history.json "Bao cao/VIMO/" 2>/dev/null || true

            if git diff --staged --quiet; then
              echo "Không có thay đổi để commit."
              PUSHED=1
              break
            fi

            git commit -m "Auto-update: Vĩ mô Việt Nam — $(date +'%Y-%m-%d')"
            if git push origin HEAD:master; then
              PUSHED=1
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 10
          done

          if [ "$PUSHED" != "1" ]; then
            echo "::error::Could not push vĩ mô update after 5 attempts (remote kept diverging)."
            exit 1
          fi

      # QUAN TRỌNG: push tạo bởi GITHUB_TOKEN mặc định KHÔNG kích hoạt các workflow "on: push"
      # khác (chống lặp vô hạn của GitHub) — gọi thẳng deploy_pages.yml để site GitHub Pages có
      # data/vimo.json mới ngay, không phải đợi lần push kế tiếp từ máy dev.
      - name: Trigger GitHub Pages redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_pages.yml --ref ${{ github.ref_name }}
